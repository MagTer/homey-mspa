name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  validate:
    name: Validate Homey app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Composes .homeycompose/** into app.json and runs the App Store rules
      # that publishing would run. Keep this green or the release will fail.
      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish
