<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Driver icon: inflatable hot tub side view, line art only, transparent background -->
  <g fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tub outer body - side profile from right angle -->
    <path d="M180 420
             C180 340 320 300 480 300
             C640 300 780 340 780 420
             L780 620
             C780 700 640 740 480 740
             C320 740 180 700 180 620 Z"/>
    
    <!-- Top rim ellipse -->
    <ellipse cx="480" cy="420" rx="300" ry="120"/>
    
    <!-- Water surface inside -->
    <ellipse cx="480" cy="415" rx="260" ry="100"/>
    
    <!-- Horizontal panel seams for inflatable look -->
    <path d="M200 500 C300 530 660 530 760 500" stroke-width="18" opacity="0.7"/>
    <path d="M205 560 C305 590 655 590 755 560" stroke-width="18" opacity="0.7"/>
    <path d="M215 620 C310 645 650 645 745 620" stroke-width="18" opacity="0.7"/>
    
    <!-- Control panel box on side -->
    <rect x="660" y="460" width="80" height="110" rx="10"/>
    <!-- Control panel screen -->
    <rect x="675" y="475" width="50" height="25" rx="4"/>
    <!-- Control panel buttons -->
    <circle cx="690" cy="525" r="8"/>
    <circle cx="710" cy="525" r="8"/>
    <line x1="680" y1="555" x2="720" y2="555" stroke-width="12"/>
    
    <!-- Bubbles on water surface -->
    <circle cx="380" cy="430" r="18"/>
    <circle cx="460" cy="450" r="14"/>
    <circle cx="540" cy="435" r="16"/>
    <circle cx="600" cy="420" r="12"/>
    
    <!-- Water highlight -->
    <path d="M340 400 C380 390 420 395 440 405" stroke-width="14" opacity="0.6"/>
  </g>
</svg>