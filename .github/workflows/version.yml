name: Version

# Cuts a release: bumps the version, writes the changelog entry and opens a pull
# request for them. Nothing here reaches main: a rule requires a PR and green
# checks, for this as for anything else. Merging the PR runs tag-release.yml,
# which tags, and pushing the v* tag is what starts the Publish workflow.
#
# Required secret: RELEASE_TOKEN, a fine-grained PAT with "Contents: write" and
# "Pull requests: write" on this repository. A PR made with the default
# GITHUB_TOKEN is refused here, and would start no checks if it were not.

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version bump
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog in English, written for users (not a commit log)
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Bump version and open the release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Updates .homeycompose/app.json and .homeychangelog.json
      - name: Update Homey app version
        id: version
        uses: athombv/github-action-homey-app-version@3342f092b437550e78074797b52fac6467a456e1 # master
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      # The Homey action does not know about npm metadata; keep them in step so
      # the version check in publish.yml passes.
      - name: Sync package.json and lockfile
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Commit, push a branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.changelog }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set, so the release PR cannot be opened"
            exit 1
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "release/v$VERSION"
          git add -A
          git commit -m "chore(release): v$VERSION"
          # This branch is this workflow's own. Forcing it is what lets a failed or
          # closed attempt at the same version run again.
          git push --force origin "release/v$VERSION"
          if ! gh pr view "release/v$VERSION" --json state --jq .state | grep -q OPEN; then
            gh pr create --base main --head "release/v$VERSION" \
              --title "chore(release): v$VERSION" --body "$NOTES"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.changelog }}
        run: |
          {
            echo "Opened the release PR for **v$VERSION**. Merging it tags and publishes."
            echo ""
            echo "> $NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
