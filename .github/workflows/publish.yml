name: Publish

# Publishes to the Homey App Store when a v* tag is pushed, or on demand.
#
# The normal path is the Version workflow, which bumps, tags and pushes for you.
# Note that tags pushed by GITHUB_TOKEN do not trigger this workflow — see the
# RELEASE_TOKEN note in version.yml. A tag you push by hand always triggers it.
#
# Required secret: HOMEY_PAT — the app owner's Personal Access Token from
# https://tools.developer.homey.app/me

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Homey App Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check versions agree
        run: |
          APP_VERSION="$(node -p "require('./.homeycompose/app.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::.homeycompose/app.json is $APP_VERSION but package.json is $PKG_VERSION"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${APP_VERSION}"
              exit 1
            fi
          fi

          if ! node -e "
            const log = require('./.homeychangelog.json');
            const v = require('./.homeycompose/app.json').version;
            if (!log[v] || !log[v].en) {
              console.error('No English changelog entry for ' + v);
              process.exit(1);
            }
          "; then
            echo "::error::.homeychangelog.json has no entry for ${APP_VERSION}"
            exit 1
          fi

          echo "Publishing ${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate
        uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # master
        with:
          level: publish

      - name: Publish
        id: publish
        uses: athombv/github-action-homey-app-publish@0642b483f1eb66fbceb0c91b73df35d45fd2f3db # master
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: Link to the release
        run: |
          echo "Manage the release at ${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
