<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a6b"/>
      <stop offset="0.45" stop-color="#3a6fb5"/>
      <stop offset="0.8" stop-color="#f5a66e"/>
      <stop offset="1" stop-color="#ffd4a3"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2b"/>
      <stop offset="1" stop-color="#3d2a18"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa6ff"/>
      <stop offset="1" stop-color="#1e6ed6"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe4a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe4a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset="1" stop-color="#2a1c10"/>
    </linearGradient>
  </defs>

  <!-- Sky / dusk -->
  <rect width="1000" height="700" fill="url(#sky)"/>

  <!-- Sun glow near horizon -->
  <circle cx="820" cy="430" r="240" fill="url(#glow)"/>
  <circle cx="820" cy="430" r="34" fill="#fff2c4" opacity="0.9"/>

  <!-- Distant mountains -->
  <path d="M0 440 L140 360 L240 410 L340 340 L460 420 L560 370 L700 430 L820 380 L1000 430 L1000 460 L0 460 Z"
        fill="#1c2f4a" opacity="0.7"/>
  <path d="M0 470 L160 410 L300 450 L420 395 L560 445 L700 400 L860 450 L1000 420 L1000 480 L0 480 Z"
        fill="#0f1f36" opacity="0.65"/>

  <!-- Trees silhouette -->
  <g fill="#0a1526" opacity="0.8">
    <path d="M60 460 L75 420 L85 450 L92 425 L102 455 L108 430 L118 462 Z"/>
    <path d="M140 462 L152 430 L162 455 L170 435 L180 460 Z"/>
    <path d="M910 462 L920 428 L930 454 L938 432 L948 460 Z"/>
  </g>

  <!-- Deck -->
  <rect x="0" y="470" width="1000" height="230" fill="url(#deck)"/>
  <g stroke="#2a1c10" stroke-width="2" opacity="0.7">
    <line x1="0" y1="510" x2="1000" y2="510"/>
    <line x1="0" y1="560" x2="1000" y2="560"/>
    <line x1="0" y1="610" x2="1000" y2="610"/>
    <line x1="0" y1="660" x2="1000" y2="660"/>
  </g>
  <g stroke="#2a1c10" stroke-width="2" opacity="0.5">
    <line x1="200" y1="470" x2="200" y2="700"/>
    <line x1="420" y1="470" x2="420" y2="700"/>
    <line x1="620" y1="470" x2="620" y2="700"/>
    <line x1="820" y1="470" x2="820" y2="700"/>
  </g>

  <!-- Ambient lantern glow -->
  <circle cx="150" cy="380" r="70" fill="#ffcf78" opacity="0.18"/>
  <circle cx="150" cy="380" r="14" fill="#ffdf8f" opacity="0.9"/>
  <line x1="150" y1="200" x2="150" y2="366" stroke="#1c1410" stroke-width="3" opacity="0.5"/>

  <!-- Tub shadow on deck -->
  <ellipse cx="500" cy="620" rx="320" ry="22" fill="#000" opacity="0.45"/>

  <!-- Hot tub body -->
  <path d="M200 410
           C200 340 340 310 500 310
           C660 310 800 340 800 410
           L800 590
           C800 660 660 690 500 690
           C340 690 200 660 200 590 Z"
        fill="url(#shell)"/>

  <!-- Quilted panels -->
  <g stroke="#333" stroke-width="3" fill="none" opacity="0.65">
    <path d="M210 460 C300 442 700 442 790 460"/>
    <path d="M210 510 C300 492 700 492 790 510"/>
    <path d="M210 560 C300 542 700 542 790 560"/>
    <path d="M210 610 C300 592 700 592 790 610"/>
  </g>

  <!-- Rim -->
  <ellipse cx="500" cy="318" rx="300" ry="54" fill="#1a1a1a"/>
  <ellipse cx="500" cy="310" rx="296" ry="50" fill="#2e2e2e"/>

  <!-- Water -->
  <ellipse cx="500" cy="308" rx="266" ry="42" fill="url(#water)"/>
  <ellipse cx="440" cy="304" rx="70" ry="8" fill="#8cc5ff" opacity="0.75"/>
  <ellipse cx="580" cy="316" rx="50" ry="5" fill="#8cc5ff" opacity="0.5"/>

  <!-- Bubbles -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="400" cy="308" r="5"/>
    <circle cx="430" cy="316" r="3"/>
    <circle cx="465" cy="304" r="5"/>
    <circle cx="500" cy="314" r="6"/>
    <circle cx="540" cy="306" r="4"/>
    <circle cx="575" cy="318" r="4"/>
    <circle cx="610" cy="308" r="5"/>
  </g>

  <!-- Control box -->
  <rect x="736" y="408" width="60" height="92" rx="5" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <rect x="744" y="418" width="44" height="20" rx="2" fill="#1e90ff"/>
  <circle cx="754" cy="458" r="4" fill="#2ecc71"/>
  <circle cx="772" cy="458" r="4" fill="#e74c3c"/>
  <rect x="746" y="474" width="40" height="5" rx="2" fill="#444"/>
  <rect x="746" y="484" width="40" height="5" rx="2" fill="#444"/>

  <!-- Steam wisps -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M380 240 C372 212 400 202 392 172"/>
    <path d="M460 220 C452 192 480 182 472 152"/>
    <path d="M540 230 C532 202 560 192 552 162"/>
    <path d="M600 245 C594 220 618 212 612 188"/>
  </g>

  <!-- Towel draped -->
  <path d="M830 490 L880 470 L895 620 L845 640 Z" fill="#e8ded0"/>
  <path d="M830 490 L880 470 L880 485 L830 505 Z" fill="#d6c8b0"/>
</svg>
