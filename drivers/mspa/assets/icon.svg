<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Hot tub / spa driver icon — right-side angle, dimensional -->
  
  <!-- Tub shadow/depth on bottom right -->
  <ellipse cx="520" cy="780" rx="320" ry="50" fill="#000000" opacity="0.12"/>
  
  <!-- Main tub body (right-side view, slightly angled) -->
  <path fill="#1E90FF" d="M160 380
    C160 280 320 240 480 240
    C640 240 800 280 800 380
    L800 620
    C800 720 640 780 480 780
    C320 780 160 720 160 620 Z"/>
  
  <!-- Body highlight/shading for dimension (right side lighter) -->
  <path fill="#4AA6FF" d="M640 260
    C720 280 800 320 800 380
    L800 620
    C800 680 720 740 640 760
    C680 680 680 340 640 260 Z" opacity="0.35"/>
  
  <!-- Horizontal panel lines for texture/dimension -->
  <path fill="none" stroke="#0D6BB8" stroke-width="18" stroke-linecap="round" opacity="0.45"
    d="M180 480 C300 520 660 520 780 480"/>
  <path fill="none" stroke="#0D6BB8" stroke-width="18" stroke-linecap="round" opacity="0.45"
    d="M195 560 C305 595 655 595 765 560"/>
  <path fill="none" stroke="#0D6BB8" stroke-width="18" stroke-linecap="round" opacity="0.45"
    d="M215 640 C315 670 645 670 745 640"/>
  
  <!-- Top rim (thickness) -->
  <ellipse cx="480" cy="380" rx="340" ry="150" fill="#147ACC"/>
  
  <!-- Inner rim / water surface -->
  <ellipse cx="480" cy="375" rx="300" ry="130" fill="#87CEFA"/>
  
  <!-- Water highlight -->
  <ellipse cx="380" cy="360" rx="120" ry="30" fill="#B8E0FF" opacity="0.7"/>
  
  <!-- Bubbles on water -->
  <circle cx="340" cy="390" r="35" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="440" cy="410" r="26" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="540" cy="385" r="32" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Control box / pump on right side -->
  <rect x="760" y="480" width="130" height="200" rx="22" fill="#0D6BB8"/>
  <rect x="775" y="495" width="100" height="170" rx="16" fill="#147ACC"/>
  
  <!-- Control box details -->
  <rect x="795" y="520" width="60" height="28" rx="6" fill="#1E90FF"/>
  <circle cx="810" cy="580" r="14" fill="#2ECC71"/>
  <circle cx="840" cy="580" r="14" fill="#E74C3C"/>
  <rect x="800" y="620" width="50" height="10" rx="4" fill="#0A5A9E"/>
  <rect x="800" y="640" width="50" height="10" rx="4" fill="#0A5A9E"/>
</svg>