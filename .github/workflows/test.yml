name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both configs: tsconfig.json compiles the TypeScript, tsconfig.check.json
      # type-checks the plain JS (api.js, widgets/**) that the build ignores.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  validate:
    name: Validate Homey app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The validator compiles the TypeScript itself, so node_modules has to be
      # in the workspace before it runs — it does not install anything.
      - name: Install dependencies
        run: npm ci

      # Composes .homeycompose/** into app.json and runs the App Store rules
      # that publishing would run. Keep this green or the release will fail.
      - uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # master
        with:
          level: publish

      # Compose rewrites app.json in place during the step above. If the result
      # differs from what is committed, the tracked file is stale — regenerate
      # it with `npx homey app build` and commit the result.
      - name: Check app.json is in sync with .homeycompose
        run: git diff --exit-code -- app.json
