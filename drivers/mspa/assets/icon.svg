<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Driver icon: generic hot tub with warm water, right-side angle -->
  
  <!-- Steam wisps (simple curved shapes) -->
  <path fill="#1E90FF" d="M300 320 Q340 260 300 200 Q270 150 310 120 Q340 100 320 140 Q290 180 330 240 Q360 290 320 320 Z"/>
  <path fill="#1E90FF" d="M460 310 Q500 250 460 190 Q430 140 470 110 Q500 90 480 130 Q450 170 490 230 Q520 280 480 310 Z"/>
  <path fill="#1E90FF" d="M620 320 Q660 260 620 200 Q590 150 630 120 Q660 100 640 140 Q610 180 650 240 Q680 290 640 320 Z"/>
  
  <!-- Tub body (right-side angled view) -->
  <path fill="#1E90FF" d="M140 420
    C140 320 260 280 480 280
    C700 280 820 320 820 420
    L820 640
    C820 740 700 800 480 800
    C260 800 140 740 140 640 Z"/>
  
  <!-- Body side highlight for dimension (right side) -->
  <path fill="#4AA6FF" d="M680 300
    C760 320 820 360 820 420
    L820 640
    C820 700 760 760 680 780
    C720 680 720 400 680 300 Z" opacity="0.35"/>
  
  <!-- Horizontal panel lines -->
  <path fill="none" stroke="#0D6BB8" stroke-width="22" stroke-linecap="round" opacity="0.4"
    d="M165 520 C300 560 660 560 795 520"/>
  <path fill="none" stroke="#0D6BB8" stroke-width="22" stroke-linecap="round" opacity="0.4"
    d="M185 610 C310 645 650 645 775 610"/>
  <path fill="none" stroke="#0D6BB8" stroke-width="22" stroke-linecap="round" opacity="0.4"
    d="M215 700 C320 725 640 725 745 700"/>
  
  <!-- Top rim -->
  <ellipse cx="480" cy="420" rx="340" ry="150" fill="#147ACC"/>
  
  <!-- Water surface -->
  <ellipse cx="480" cy="415" rx="300" ry="130" fill="#87CEFA"/>
  
  <!-- Water highlight -->
  <ellipse cx="380" cy="395" rx="120" ry="35" fill="#B8E0FF" opacity="0.7"/>
  
  <!-- Bubbles on water -->
  <circle cx="360" cy="460" r="32" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="480" cy="480" r="26" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="600" cy="455" r="30" fill="#FFFFFF" opacity="0.9"/>
</svg>