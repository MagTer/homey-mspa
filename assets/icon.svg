<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: top-down view of a circular spa -->
  <!-- Outer rim -->
  <circle cx="256" cy="256" r="200" fill="#1E90FF"/>
  <!-- Inner rim -->
  <circle cx="256" cy="256" r="175" fill="#147ACC"/>
  <!-- Water surface -->
  <circle cx="256" cy="256" r="155" fill="#87CEFA"/>
  <!-- Water highlight -->
  <ellipse cx="216" cy="236" rx="70" ry="25" fill="#B8E0FF" opacity="0.7"/>
  <!-- Bubbles -->
  <circle cx="200" cy="220" r="22" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="280" cy="190" r="16" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="320" cy="260" r="20" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="240" cy="300" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="300" cy="310" r="12" fill="#FFFFFF" opacity="0.8"/>
  <!-- Small pump indicator dot on rim -->
  <circle cx="400" cy="256" r="18" fill="#0D6BB8"/>
  <circle cx="400" cy="256" r="10" fill="#4AA6FF"/>
</svg>